spring:
  application:
    name: race
  datasource:
    # serverTimezone 을 주면 드라이버가 datetime 을 그 시간대의 instant 로 보고 JVM 시간대로 옮긴다
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:race}?characterEncoding=UTF-8
    username: ${DB_USERNAME:race}
    password: ${DB_PASSWORD:race}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 로컬은 docker-compose.yml 의 redis, 배포는 VPC 안의 별도 서버다
      # 배포 값은 compose 가 배포 스크립트의 환경변수에서 보간해 넣어 준다
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 기본값은 무한 대기가 아니라 lettuce 의 60s 다, 응답이 늦는 것과 죽은 것을 그때까지 구분하지 못한다
      # 요청 스레드가 물고 늘어지는 시간이라 짧게 끊는다
      timeout: 2s
  jpa:
    # 켜 두면 요청이 끝날 때까지 영속성 컨텍스트가 열려 있고 커넥션도 그동안 잡힌다
    # 경매방 구독은 응답이 끝나지 않는 요청이라 연결 하나가 커넥션 하나를 수십 분 쥔다
    # 연결 셋에 활성 커넥션이 셋이 되고 그 상태에서 무관한 조회가 500 이 되는 것을 재고 껐다
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

aws:
  s3:
    bucket: ${S3_BUCKET:race-s3-819363426327-ap-northeast-2-an}
    region: ${S3_REGION:ap-northeast-2}
    # 조회용 CloudFront 도메인이다. S3 를 퍼블릭으로 열지 않는다 — 버킷은 OAC 로 잠긴 채
    # CloudFront 만 읽는다. 업로드는 서명이 S3 호스트에 묶여 있어 그쪽으로 직접 보내고,
    # 브라우저가 이미지를 조회할 때만 이 주소를 쓴다
    # 비밀이 아니고 환경마다 다르지도 않아 기본값으로 둔다, 배포 스크립트가 내려줄 것이 없다
    cdn-base-url: ${CDN_BASE_URL:https://www.f1race.site}
    # 길게 잡아도 의미가 없다, EC2 인스턴스 역할의 임시 자격 증명으로 서명하면
    # 그 세션이 만료될 때 주소도 함께 죽는다
    presign-expiry: 15m

auth:
  session:
    # 체감 유휴 타임아웃은 ttl - renew-threshold ~ ttl 구간(15~30분)이다
    # 정확히 30분을 보장해야 하면 ttl 60m / renew-threshold 30m로 바꾼다
    ttl: 30m
    renew-threshold: 15m
  cookie:
    # 로컬은 http라 true로 두면 브라우저가 쿠키를 저장하지 않는다, 배포 시 true
    secure: false
    # 5173과 8080은 같은 site(scheme + eTLD+1, 포트 무관)라 Lax로 충분하고
    # 타 사이트발 POST에는 쿠키가 실리지 않아 CSRF 주 경로가 막힌다
    same-site: Lax
  # 정확한 오리진이 아니라 패턴이다, allowedOriginPatterns 로 넘어가므로 * 를 쓸 수 있다
  # 로컬은 포트를 열어 둔다, 호스트는 루프백으로 묶여 있고 운영 값은 application-prod.yml 이 덮어쓴다
  # vite 는 PORT 로 포트가 바뀌고, 백엔드 자신인 8080 도 목록에 있어야 한다 — Spring 은 Origin 헤더의
  # 존재만으로 CORS 로 판정하고 브라우저는 GET/HEAD 가 아니면 same-origin 에도 Origin 을 붙여서,
  # 빠지면 8080 의 Swagger UI 에서 GET 은 되고 POST 만 403 이 된다
  # 포트 와일드카드는 :* 가 아니라 :[*] 다, OriginPattern 이 이 형태만 (:\d+)? 로 바꾼다
  # 목록을 비우면 기동이 실패한다, 빈 값이 전면 개방으로 뒤집히지 않게 하려는 것이다
  allowed-origins:
    - http://localhost:[*]
    - http://127.0.0.1:[*]

notification:
  delivery:
    executor:
      # 실제 SseEmitter.send를 실행하는 고정 플랫폼 스레드 수다.
      # 블로킹 I/O가 많아 2 vCPU보다 약간 많은 4개로 시작하되, 측정 후 조정한다.
      threads: 4
      # 대기·실행 중인 SSE 작업의 전체 상한이다. 무한 큐가 1GiB 메모리를 잠식하지 못하게 한다.
      queue-capacity: 1024
      # 회원 한 명이 점유할 수 있는 상한이다. 느린 한 회원이 전체 큐를 독점하지 못하게 한다.
      per-user-queue-capacity: 256
      # 배포 종료 때 이 시간까지만 대기 작업을 비운다. 이후 SSE는 버려도 DB 알림은 남는다.
      shutdown-await: 10s

race:
  room:
    # 열린 연결마다 keep-alive 를 보내고 실패한 것을 명부에서 뺀다, 상한은 앞단 프록시의 90초다
    heartbeat-interval-seconds: 60
    # 마감 방송이 유실된 방을 끊는다, 정상 경로는 방송 직후에 끊으므로 여기까지 오지 않는다
    # 부하가 이 값을 안 가른다, 방 200개에서 1초와 30초 사이 입찰 응답이 회차 흔들림 안이었다
    ended-room-close-interval-seconds: 5
    broadcast-workers: 32
  list:
    # 느린 구독 하나가 일꾼 하나를 붙잡는다. 이 값의 근거는 측정으로 채운다
    broadcast-workers: 32