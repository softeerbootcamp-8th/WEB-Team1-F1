spring:
  jpa:
    hibernate:
      # 재배포마다 스키마를 지우지 않고 엔티티 기준으로 부족한 것만 반영한다
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: info

auth:
  cookie:
    secure: true
    # None 이 아니라 Lax 다. SameSite 의 site 는 scheme + eTLD+1 이라 서브도메인이 달라도
    # www.f1race.site 와 api.f1race.site 는 같은 site 이고, 이 요청들은 cross-site 가 아니다
    # None 으로 풀면 무관한 사이트에서 온 요청에도 세션이 실려 CSRF 방어만 잃는다
    same-site: Lax
  # 오리진은 다르므로(호스트가 다르다) CORS 는 여전히 필요하다
  # 프론트는 credentials: 'include' 로 보내야 쿠키가 실린다
  allowed-origins:
    - https://www.f1race.site

# 문서 경로는 AuthInterceptor 가 거는 /api/** 밖이라 인증을 타지 않는다
# 켜 두면 전체 엔드포인트와 스키마가 무인증으로 공개된다, 같은 문서는 로컬에서 그대로 나온다
# 되살릴 때는 auth.allowed-origins 에 https://api.f1race.site 도 넣어야 POST 가 동작한다
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
