# 테스트 전용 설정, 같은 이름이라 메인 설정을 가린다
# datasource 를 두지 않아, 컨테이너를 띄우는 부모를 상속하지 않은 테스트는
# 개발용 DB 로 조용히 붙는 대신 컨텍스트 로딩에서 실패한다
#
# spring.data.redis 도 같은 이유로 두지 않는다. 다만 DB 와 달리 여기서 막을 수는 없다 —
# 호스트·포트 기본값이 auto-config 안에 박혀 있어, 설정을 비워도 localhost:6379 가 된다.
# 연결이 지연 생성이라 Redis 를 실제로 쓰지 않는 테스트는 그래도 아무 데도 붙지 않고,
# 쓰는 테스트는 IntegrationTestSupport 를 상속해 컨테이너 주소를 받는다
spring:
  application:
    name: race
  jpa:
    # 이 파일이 메인 설정을 가리므로 거기 적은 값이 테스트에는 오지 않는다, 같은 값을 여기도 둔다
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 이 설정이 메인 설정을 가리므로 여기에도 두어야 한다
# 필수 항목이 비면 S3Properties 가 기동을 실패시켜 통합테스트 전부가 컨텍스트 로딩에서 깨진다
# 실제 S3 를 호출하지 않으므로 값은 형식만 맞으면 된다
aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    cdn-base-url: https://cdn.test.local

# 이 설정이 메인 설정을 가리므로 여기에도 두어야 한다
# 비면 AuthWebMvcConfig 가 기동을 실패시켜 웹 계층을 띄우는 테스트 전부가 컨텍스트 로딩에서 깨진다
auth:
  # 메인 설정과 같은 패턴을 써서 시나리오 6·8 이 :[*] 의 매칭까지 함께 확인하게 한다
  allowed-origins:
    - http://localhost:[*]

# 배경 스레드가 테스트 중에 DB 를 건드리면 검증 대상 데이터가 흔들린다
race:
  scheduling:
    enabled: false
  room:
    heartbeat-interval-seconds: 60
    ended-room-close-interval-seconds: 5
    broadcast-workers: 32
  list:
    # 느린 구독 하나가 일꾼 하나를 붙잡는다. 이 값의 근거는 측정으로 채운다
    broadcast-workers: 32