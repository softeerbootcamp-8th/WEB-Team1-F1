# 테스트 전용 설정, 같은 이름이라 메인 설정을 가린다
# datasource 를 두지 않아, 컨테이너를 띄우는 부모를 상속하지 않은 테스트는
# 개발용 DB 로 조용히 붙는 대신 컨텍스트 로딩에서 실패한다
spring:
  application:
    name: race
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 배경 스레드가 테스트 중에 DB 를 건드리면 검증 대상 데이터가 흔들린다
race:
  scheduling:
    enabled: false
