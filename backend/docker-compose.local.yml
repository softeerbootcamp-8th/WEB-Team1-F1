# 로컬에서 파일 업로드를 거치는 흐름(평가서 작성 등)을 볼 때만 띄우는 S3 대역이다.
# DB 는 docker-compose.yml 에 그대로 있고, 이 파일은 거기에 얹는 것이 아니라 따로 뜬다.
#
#   docker compose -f docker-compose.local.yml up -d
#   SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
#
# 배포된 버킷은 EC2 인스턴스 역할에만 쓰기를 열어 준다. 개발자 노트북에서 발급한 주소는
# 서명까지는 성공하고(서명 계산은 로컬이라 권한을 보지 않는다) 실제 PUT 에서 403 이 된다.
# S3 API 호환 서버를 대신 세우고 엔드포인트만 갈아 끼우면 같은 코드로 같은 흐름이 돈다 —
# 갈리는 것은 S3Config 의 presigner 하나뿐이다.

# 프로젝트 이름을 박아 docker-compose.yml 과 갈라 둔다. 이게 없으면 둘 다 디렉터리 이름인
# backend 프로젝트가 되어, DB 만 올리는 docker compose up -d 가 여기 컨테이너들을
# 고아로 보고 경고를 뱉는다
name: race-local

services:
  minio:
    image: minio/minio
    container_name: race-minio
    ports:
      - "9000:9000"   # S3 API, 서명된 업로드 주소가 이 포트를 가리킨다
      - "9001:9001"   # 웹 콘솔, 올라간 객체를 눈으로 확인할 때 쓴다
    environment:
      MINIO_ROOT_USER: race
      MINIO_ROOT_PASSWORD: racelocal
      # 리전은 서명에 들어간다, application-local.yml 의 aws.s3.region 과 어긋나면 검증에서 떨어진다
      MINIO_REGION_NAME: ap-northeast-2
    command: server /data --console-address ":9001"
    volumes:
      - race-minio-data:/data

  # 버킷을 만들고 익명 읽기를 열어 주는 일회성 컨테이너다, 할 일을 마치면 그대로 종료된다
  # 배포에서 CloudFront 가 하던 조회를 여기서는 이 익명 읽기가 대신한다,
  # 이게 없으면 업로드는 되는데 발급된 fileUrl 을 화면에서 403 으로 못 본다
  minio-init:
    image: minio/mc
    container_name: race-minio-init
    depends_on:
      - minio
    # healthcheck 로 기다리지 않고 alias 등록을 재시도한다, minio 이미지에 curl 이 있는지가
    # 태그마다 갈려 healthcheck 쪽이 오히려 잘 깨진다
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 race racelocal; do sleep 1; done &&
             mc mb --ignore-existing local/race-local &&
             mc anonymous set download local/race-local"

volumes:
  race-minio-data:
