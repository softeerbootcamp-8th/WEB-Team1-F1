plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.softeer'
version = '0.0.1-SNAPSHOT'
description = 'race'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 배포 시 컨테이너 healthcheck 가 /actuator/health 로 기동 완료와 DB 연결을 함께 확인한다
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    // 평가 사진을 S3 에 올린다, 서버는 presigned URL 만 발급하고 파일은 브라우저가 직접 보낸다
    // BOM 이 s3 와 그 전이 의존성(auth, http-client 등)의 버전을 한 곳에서 맞춘다
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    // experiment 태그는 레이스를 확률로 재현하는 실험이라 초록이 아무것도 보장하지 않는다
    // CI 에서 돌리면 시간만 쓰고 결과가 흔들리므로 뺀다, 돌릴 때는 ./gradlew experiment
    useJUnitPlatform {
        excludeTags 'experiment'
    }
}

tasks.register('experiment', Test) {
    useJUnitPlatform {
        includeTags 'experiment'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // 조건을 바꿔가며 돌린다, ./gradlew experiment -Psubscribers=50
    systemProperty 'subscribers', findProperty('subscribers') ?: '10'
    systemProperty 'slow', findProperty('slow') ?: '0'
    systemProperty 'bidders', findProperty('bidders') ?: '5'
    systemProperty 'runs', findProperty('runs') ?: '1'
    systemProperty 'seconds', findProperty('seconds') ?: '20'
    // 실험 결과가 표준 출력으로 나온다
    testLogging.showStandardStreams = true
    // 조건만 바꿔 다시 돌릴 때 up-to-date 로 건너뛰지 않게 한다
    outputs.upToDateWhen { false }
}
