services:
  mysql:
    image: mysql:8.4
    container_name: race-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: race
      MYSQL_USER: race
      MYSQL_PASSWORD: race
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - race-mysql-data:/var/lib/mysql

volumes:
  race-mysql-data:
