services:
  mysql:
    image: mysql:8.4
    container_name: race-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: race
      MYSQL_USER: race
      MYSQL_PASSWORD: race
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - race-mysql-data:/var/lib/mysql

  redis:
    # 배포 대상은 VPC 안의 별도 서버다, 그쪽 버전이 바뀌면 이 태그도 같이 맞춘다
    image: redis:8-alpine
    container_name: race-redis
    ports:
      - "6379:6379"
    # 볼륨을 붙이지 않아 컨테이너를 내리면 데이터가 사라진다
    # 로컬에서 Redis 에 남는 것은 다시 만들 수 있는 것들이고,
    # 지난 실행이 남긴 값이 다음 실행으로 새는 편이 디버깅에 더 나쁘다
    command: redis-server --save "" --appendonly no

volumes:
  race-mysql-data:
