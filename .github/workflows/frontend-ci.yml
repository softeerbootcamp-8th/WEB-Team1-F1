name: Frontend CI

# 테스트가 없어 oxlint 와 tsc -b 가 유일한 자동 검사다
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # main 은 CD 가 자체적으로 다시 검증·빌드하므로 CI push 는 dev 만 실행한다
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-node 의 pnpm 캐시가 pnpm 을 먼저 요구하므로 순서를 뒤집지 않는다
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          # 락파일이 저장소 루트가 아니라 frontend 하위에 있다
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # 빌드보다 먼저 돌린다, 더 빠르고 먼저 깨지는 편이 낫다
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
