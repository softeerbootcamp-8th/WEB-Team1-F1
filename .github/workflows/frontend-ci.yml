name: Frontend CI

# 테스트가 없어 oxlint 와 tsc -b 가 유일한 자동 검사다
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # 캐시를 쓰는 쪽은 dev 트리거다
  # main 은 배포 기준이라, 릴리즈 커밋에 대응하는 산출물을 남기려고 넣는다
  push:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-node 의 pnpm 캐시가 pnpm 을 먼저 요구하므로 순서를 뒤집지 않는다
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          # 락파일이 저장소 루트가 아니라 frontend 하위에 있다
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # 배포는 이 산출물을 받아 올린다, 각자 노트북에서 만든 것이 올라가지 않게 한다
      # 이름에 커밋 sha 가 들어가 어떤 시점의 코드가 배포됐는지 남는다
      # main 만 올린다, 배포 기준이 릴리즈 커밋이라 dev 산출물은 쓰이지 않는다
      - name: Upload build output
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 30
