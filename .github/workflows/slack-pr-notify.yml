name: Slack PR Notification

# 팀 공용 PR 알림 (서버 사이드). PR 열림/머지/리뷰 요청 시 Slack 채널로 카드형 메시지를 전송한다.
# 웹훅 URL 은 repo secret SLACK_WEBHOOK_URL 에 보관.
on:
  pull_request:
    types: [opened, closed, review_requested]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGER: ${{ github.event.pull_request.merged_by.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
        run: |
          # closed 인데 머지 안 됨(그냥 닫힘) → 알림 생략
          if [ "$ACTION" = "closed" ] && [ "$MERGED" != "true" ]; then
            echo "PR closed without merge — skip"
            exit 0
          fi

          # 팀 단위 리뷰 요청(requested_team)은 개별 리뷰어가 없어 스킵
          if [ "$ACTION" = "review_requested" ] && [ -z "$REVIEWER" ]; then
            echo "team review requested (no individual reviewer) — skip"
            exit 0
          fi

          TITLE_LINK="*<${PR_URL}|#${PR_NUMBER} · ${PR_TITLE}>*"

          if [ "$ACTION" = "opened" ]; then
            PAYLOAD=$(jq -n \
              --arg fallback "🚀 새 PR #${PR_NUMBER}: ${PR_TITLE}" \
              --arg link "$TITLE_LINK" \
              --arg author "$PR_AUTHOR" \
              --arg base "$PR_BASE" \
              '{
                text: $fallback,
                blocks: [
                  { type: "header", text: { type: "plain_text", text: "🚀  새 Pull Request 등록", emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $link } },
                  { type: "context", elements: [
                      { type: "mrkdwn", text: ("👤  *작성자*  " + $author) },
                      { type: "mrkdwn", text: ("🎯  *대상*  `" + $base + "`") },
                      { type: "mrkdwn", text: "📝  리뷰 부탁드려요!" }
                  ] }
                ]
              }')
          elif [ "$ACTION" = "review_requested" ]; then
            PAYLOAD=$(jq -n \
              --arg fallback "🔄 재리뷰 요청 #${PR_NUMBER} → ${REVIEWER}: ${PR_TITLE}" \
              --arg link "$TITLE_LINK" \
              --arg author "$PR_AUTHOR" \
              --arg reviewer "$REVIEWER" \
              --arg base "$PR_BASE" \
              '{
                text: $fallback,
                blocks: [
                  { type: "header", text: { type: "plain_text", text: "🔄  리뷰 요청", emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $link } },
                  { type: "context", elements: [
                      { type: "mrkdwn", text: ("👤  *작성자*  " + $author) },
                      { type: "mrkdwn", text: ("🙋  *리뷰어*  " + $reviewer) },
                      { type: "mrkdwn", text: ("🎯  *대상*  `" + $base + "`") }
                  ] }
                ]
              }')
          else
            PAYLOAD=$(jq -n \
              --arg fallback "✅ PR #${PR_NUMBER} 머지됨: ${PR_TITLE}" \
              --arg link "$TITLE_LINK" \
              --arg author "$PR_AUTHOR" \
              --arg merger "$PR_MERGER" \
              --arg base "$PR_BASE" \
              '{
                text: $fallback,
                blocks: [
                  { type: "header", text: { type: "plain_text", text: "🎉  PR 머지 완료", emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $link } },
                  { type: "context", elements: [
                      { type: "mrkdwn", text: ("✍️  *작성자*  " + $author) },
                      { type: "mrkdwn", text: ("🔀  *머지*  " + $merger) },
                      { type: "mrkdwn", text: ("🎯  *대상*  `" + $base + "`") }
                  ] }
                ]
              }')
          fi

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
