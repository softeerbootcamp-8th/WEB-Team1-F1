name: Backend CI

# 통합테스트가 Testcontainers 로 MySQL 을 띄우므로 러너에 services 로 DB 를 붙이지 않는다
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # 캐시를 쓰는 쪽은 이 트리거다. 기본 브랜치가 아니면 setup-gradle 이 캐시를 쓰지 않는다
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 기본값 enhanced 는 외부 상용 캐싱 서비스를 경유한다
          cache-provider: basic
          add-job-summary-as-pr-comment: on-failure

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.run_number }}
          path: backend/build/reports/tests/test
          retention-days: 7
