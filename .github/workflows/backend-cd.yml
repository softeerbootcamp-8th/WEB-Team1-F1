name: Backend CD

# main 에 머지되면(=push) 이미지를 빌드해 GHCR 에 올리고 앱 EC2 에 배포한다
# workflow_dispatch 는 재배포 창구다, 경로 필터에 걸리지 않는 변경이나 서버 이상 시 손으로 다시 민다
# 롤백은 이전에 성공한 실행을 Actions 에서 re-run 하면 그 커밋으로 다시 빌드·배포된다
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/web-team1-f1-backend

jobs:
  # PR 체크 이후 main 이 움직였으면 실제 배포되는 상태는 테스트된 적이 없다
  # 이미지 빌드와 병렬로 돌리고 deploy 가 둘 다 기다린다
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cd-test-report-${{ github.run_number }}
          path: backend/build/reports/tests/test
          retention-days: 7

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 테스트와 병렬이라 이 시점엔 검증이 끝나 있지 않다, latest 를 달면 검증 안 된 이미지가 그 이름을 차지한다
      # 배포는 항상 커밋 sha 로 지정하므로 latest 를 쓰는 경로가 없다
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/docker-compose.prod.yml
          target: /home/ec2-user/race-backend
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_ACTOR,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,REDIS_HOST,REDIS_PORT
          script: |
            set -euo pipefail
            cd /home/ec2-user/race-backend

            # DB·Redis 접속 정보는 이 셸의 환경변수로만 존재하고 compose 가 거기서 보간한다
            # 파일로 떨어뜨리지 않아 서버에 평문 사본이 남지 않는다
            # 예전 배포가 남긴 .env 가 있으면 compose 가 그걸 먼저 읽어 낡은 값으로 뜬다
            rm -f .env

            # 되돌릴 대상은 pull 전에 잡아둔다, up 이 실패한 뒤엔 이전 컨테이너가 사라져 물어볼 수 없다
            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' race-backend 2>/dev/null || true)

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose -f docker-compose.prod.yml pull

            # --wait 가 healthcheck 통과까지 기다린다, 실패하면 이전 컨테이너는 이미 교체된 뒤다
            if ! docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 150; then
              docker compose -f docker-compose.prod.yml logs --tail=100 app

              # 이전 이미지가 아직 남아 있는 것은 prune 이 아래 성공 경로에만 있기 때문이다, 위로 옮기면 되돌리기가 깨진다
              if [ -z "$PREV_IMAGE" ] || [ "$PREV_IMAGE" = "${PREV_IMAGE%:*}" ]; then
                echo "되돌릴 이미지가 없다, 서비스가 중단된 채로 남는다"
              elif [ "${PREV_IMAGE##*:}" = "$IMAGE_TAG" ]; then
                echo "직전 버전이 방금 실패한 버전과 같다, 되돌리지 않는다"
              else
                echo "직전 버전으로 되돌린다: $PREV_IMAGE"
                # 원 배포보다 짧게 끊어, 원인이 환경이라 이전 버전도 실패할 때 대기가 두 배가 되는 것을 막는다
                if IMAGE_TAG="${PREV_IMAGE##*:}" docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 60; then
                  echo "되돌리기 성공, 서비스는 이전 버전으로 동작한다"
                else
                  echo "되돌리기 실패, 서비스가 중단된 채로 남는다"
                fi
              fi

              # 되돌리기에 성공해도 배포는 실패다, 초록으로 만들면 깨진 배포가 조용히 지나간다
              exit 1
            fi

            # prune -f 는 dangling 만 지워서 sha 로 태그된 이전 이미지가 계속 쌓인다
            # 이 박스는 앱 컨테이너만 돌므로 -a 로 미사용 이미지를 다 지워도 남는 건 방금 띄운 것뿐이다
            docker image prune -af
            docker logout ghcr.io
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Redis 는 앱 EC2 가 아니라 VPC 안의 별도 서버다
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          # 등록하지 않으면 빈 값으로 넘어가고 compose 가 기본 포트로 채운다
          REDIS_PORT: ${{ secrets.REDIS_PORT }}

  # 세 잡이 어떻게 끝났든 결과를 알린다
  # always() 는 취소된 실행까지 붙잡아 워크플로가 타임아웃까지 매달릴 수 있어 문서가 권하지 않는다
  # 취소는 사람이 직접 누른 것이라 알릴 대상도 아니다
  notify:
    name: Notify
    needs: [test, build-and-push, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 배포가 서버 단계에서 멈췄을 때 서비스가 살아 있는지 직접 확인하는 데 쓴다
          EC2_HOST: ${{ secrets.EC2_HOST }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:7}"

          # 서버가 실제로 갱신된 경로는 deploy 뿐이다, 앞이 다 초록이어도 배포가 안 됐으면 성공이 아니다
          if [ "$DEPLOY_RESULT" = "success" ]; then
            PAYLOAD=$(jq -n \
              --arg fallback "✅ 서버 배포 완료 ${SHORT_SHA}" \
              --arg sha "$SHORT_SHA" \
              --arg url "$RUN_URL" \
              '{
                text: $fallback,
                blocks: [
                  { type: "header", text: { type: "plain_text", text: "🚀  서버 배포 완료", emoji: true } },
                  { type: "context", elements: [
                      { type: "mrkdwn", text: ("📦  *버전*  `" + $sha + "`") },
                      { type: "mrkdwn", text: ("🔗  <" + $url + "|실행 기록>") }
                  ] }
                ]
              }')
          else
            # 앞이 깨지면 뒤는 skipped 가 되므로, 위에서부터 failure 를 찾으면 최초 실패 지점이 나온다
            if [ "$TEST_RESULT" = "failure" ]; then
              STAGE="테스트"
            elif [ "$BUILD_RESULT" = "failure" ]; then
              STAGE="이미지 빌드"
            elif [ "$DEPLOY_RESULT" = "failure" ]; then
              STAGE="서버 배포"
            else
              STAGE="알 수 없음"
            fi

            # 앞 단계 실패는 서버를 건드리지 않았으므로 확인하지 않는다
            SERVICE=""
            if [ "$STAGE" = "서버 배포" ]; then
              if curl -fsS -m 10 -o /dev/null "http://${EC2_HOST}:8080/actuator/health"; then
                SERVICE="서비스는 정상 동작 중입니다"
              else
                SERVICE="서비스가 응답하지 않습니다, 지금 확인이 필요합니다"
              fi
            fi

            PAYLOAD=$(jq -n \
              --arg fallback "❌ 서버 배포 실패 (${STAGE}) ${SHORT_SHA} ${SERVICE}" \
              --arg stage "$STAGE" \
              --arg service "$SERVICE" \
              --arg sha "$SHORT_SHA" \
              --arg url "$RUN_URL" \
              '{
                text: $fallback,
                blocks: [
                  { type: "header", text: { type: "plain_text", text: "🚨  서버 배포 실패", emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: ("*" + $stage + "* 단계에서 멈췄습니다" + (if $service == "" then "" else "\n" + $service end)) } },
                  { type: "context", elements: [
                      { type: "mrkdwn", text: ("📦  *버전*  `" + $sha + "`") },
                      { type: "mrkdwn", text: ("🔗  <" + $url + "|실행 기록에서 원인 확인>") }
                  ] }
                ]
              }')
          fi

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
