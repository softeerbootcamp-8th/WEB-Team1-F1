name: Frontend CD

# main 에 머지되면(=push) 프론트를 검증·빌드해 S3 에 배포한다
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'

# 같은 배포가 겹치면 S3 에 서로 다른 버전의 파일이 섞일 수 있어 순서대로 처리한다
concurrency:
  group: frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy via EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build

      # 커밋별 디렉터리를 사용해 이전 배포에서 삭제된 파일이 섞이지 않게 한다
      - name: Copy build output to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: frontend/dist
          target: /home/ec2-user/race-frontend/releases/${{ github.sha }}
          strip_components: 1

      # AWS 키를 전달하지 않고 EC2 instance role 의 임시 자격 증명을 사용한다
      - name: Deploy to S3 and invalidate CloudFront
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RELEASE_SHA
          script: |
            set -euo pipefail

            # 삭제 경로에 외부 입력을 쓰므로 커밋 SHA 형식을 먼저 제한한다
            if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "올바르지 않은 커밋 SHA: $RELEASE_SHA"
              exit 1
            fi

            RELEASE_ROOT="/home/ec2-user/race-frontend/releases/${RELEASE_SHA}"
            RELEASE_DIR="${RELEASE_ROOT}/dist"
            trap 'rm -rf "$RELEASE_ROOT"' EXIT

            test -f "${RELEASE_DIR}/index.html"

            aws s3 sync \
              "${RELEASE_DIR}/" \
              s3://race-s3-819363426327-ap-northeast-2-an/dist/ \
              --delete

            aws cloudfront create-invalidation \
              --distribution-id E1FW7NAZPBWSR4 \
              --paths "/*"
        env:
          RELEASE_SHA: ${{ github.sha }}
